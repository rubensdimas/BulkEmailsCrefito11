services:
  # PostgreSQL Database
  postgres:
    image: postgres:alpine3.22
    container_name: bulkmail-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bulkmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulkmail123}
      POSTGRES_DB: ${POSTGRES_DB:-bulkmail}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - bulkmail-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bulkmail}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis for Queue
  redis:
    image: redis:8.4.2-alpine
    container_name: bulkmail-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bulkmail-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bulkmail-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${BACKEND_PORT:-3000}
      UPLOAD_DIR: /app/uploads
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bulkmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulkmail123}
      POSTGRES_DB: ${POSTGRES_DB:-bulkmail}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAILGRID_HOST: ${MAILGRID_HOST}
      MAILGRID_USER: ${MAILGRID_USER}
      MAILGRID_PASS: ${MAILGRID_PASS}
      MAILGRID_SENDER: ${MAILGRID_SENDER:-noreply@bulkmail.com}
      MAILGRID_SENDER_NAME: ${MAILGRID_SENDER_NAME:-BulkMail Pro}
      MAILGRID_WEBHOOK_TOKEN: ${MAILGRID_WEBHOOK_TOKEN:-}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads:rw
      - ./assets:/assets:ro
    networks:
      - bulkmail-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "echo 'Waiting for database...' && 
             until pg_isready -h postgres -p 5432 -U ${POSTGRES_USER:-bulkmail}; do sleep 1; done && 
             echo 'Running migrations...' && 
             npm run migrate && 
             echo 'Starting application...' && 
             npm run dev"

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bulkmail-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "5173:80"
    networks:
      - bulkmail-network
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # Worker for email processing
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bulkmail-worker
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bulkmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulkmail123}
      POSTGRES_DB: ${POSTGRES_DB:-bulkmail}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAILGRID_HOST: ${MAILGRID_HOST}
      MAILGRID_USER: ${MAILGRID_USER}
      MAILGRID_PASS: ${MAILGRID_PASS}
      MAILGRID_SENDER: ${MAILGRID_SENDER:-noreply@bulkmail.com}
      MAILGRID_SENDER_NAME: ${MAILGRID_SENDER_NAME:-BulkMail Pro}
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads:rw
      - ./assets:/assets:ro
    networks:
      - bulkmail-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm run worker"

networks:
  bulkmail-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads:
