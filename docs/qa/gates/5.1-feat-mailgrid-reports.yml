schema: 1
story: "5.1"
story_title: "Relatórios Mailgrid (arquivo de envios e rotinas de coleta)"
gate: CONCERNS
status_reason: "Os 22 ACs estão implementados e verificados por testes, todos os quality_gate_tools passam e não há issue de severidade alta. Restam pendências não bloqueantes: carga inicial real de 90 dias e deploy de produção não verificados, vulnerabilidades de dependências pré-existentes e minors adiados e aceitos."
reviewer: "Quinn (Test Architect)"
updated: "2026-11-12T23:59:00-03:00"
quality_score: 85
top_issues:
  - id: "REQ-001"
    severity: medium
    finding: "A carga inicial real de 90 dias (13 blocos) e o deploy de produção não foram verificados; o smoke real cobriu só 1 h (17 buscados/17 inseridos, depois 0). Ambientes existentes precisam do secret bulkmail_mailgrid_report_token antes do deploy, senão o stack não sobe."
    suggested_action: "Criar o secret antes do deploy, rodar a carga inicial em produção e conferir no histórico que os 13 blocos terminam em success com contadores plausíveis (reduzir para blocos de 1 dia se algum vier cortado, conforme Dev Notes)."
  - id: "SEC-001"
    severity: medium
    finding: "npm audit --omit=dev (backend) reporta 1 crítica (proxy-addr), 2 altas (body-parser, brace-expansion) e 2 moderadas (ip-address, qs), todas transitivas e pré-existentes; a nova dependência @fast-csv/format não tem advisory."
    suggested_action: "Tratar na story de atualização de dependências já recomendada no gate 4.2."
  - id: "REL-001"
    severity: low
    finding: "Minors adiados e aceitos na revisão da branch: corrida check-then-act no enqueueBackfill; erros do stream CSV após os headers, sem backpressure/abort; 200 não-JSON gravado como request_failed; started_at do backfill = hora do enfileiramento; chunks do insertEntries fora de transação (seguro por ser idempotente); PUT /settings grava antes do applySchedule; link de CSV pode usar filtros novos antes do count; grep de log do runbook encontra pouco; banner role=alert reanunciado a cada navegação. Os blocos da carga inicial não têm attempts no Bull: o 'retry próprio' de cada bloco é o retry 3x do cliente, e um bloco que falha exige nova carga (idempotente)."
    suggested_action: "Agrupar em story de manutenção; priorizar o stream CSV (abort/backpressure) e a corrida do backfill."
  - id: "PERF-001"
    severity: low
    finding: "AC 22: só há índices em event_at (event_at DESC, id DESC) e msgid; os filtros parciais (ILIKE) e sender_host/tipo_status dependem do recorte por event_at. Verificado com EXPLAIN sobre 60 mil linhas na consulta padrão (7 dias), suficiente para o volume previsto (~60 mil/ano), mas períodos longos com filtro de destinatário percorrem todo o intervalo."
    suggested_action: "Se o volume crescer, avaliar pg_trgm em email_para/assunto ou índice composto em (sender_host, event_at)."
  - id: "TEST-001"
    severity: low
    finding: "CodeRabbit não está instalado (sem revisão automatizada complementar). Os specs Playwright que não mockam /api/admin/mailgrid-reports/status geram ruído de proxy ECONNREFUSED no log (74 ocorrências), sem falha."
    suggested_action: "Instalar CodeRabbit no ambiente de QA; mockar /status no setup comum dos specs auth."
