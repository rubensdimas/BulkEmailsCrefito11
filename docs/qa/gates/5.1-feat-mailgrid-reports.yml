    status: CONCERNS
    notes: "/api/reports atrás de requireAuthentication/requireTrustedOrigin/requirePasswordCurrent; /api/admin/mailgrid-reports com requireAdmin (403 operator testado no app real). Token só do ambiente/secret file, nunca logado nem devolvido, error_message sanitizado e truncado (testado). LIKE escapado, CSV com neutralização de fórmulas, filtros validados. Pendência: vulnerabilidades de dependências pré-existentes."
  performance:
    status: PASS
    notes: "Consulta padrão e count usam Bitmap Index Scan em event_at com 60 mil linhas; paginação no servidor (50) e CSV limitado a 100 mil linhas com 422."
  reliability:
    status: PASS
    notes: "Inserção idempotente ON CONFLICT DO NOTHING (integração), retry 3x com backoff só para rede/5xx, 207 sem retry, backfill travado há mais de 6 h não bloqueia novo backfill, falha do worker de relatório não derruba o envio de e-mail."
  maintainability:
    status: PASS
    notes: "Cliente, coletor, configuração, consulta e rotas separados, com dependências injetáveis e testes unitários; reaproveita system_config, settingsAudit, readSecret, SettingsLayout e AppHeader."
