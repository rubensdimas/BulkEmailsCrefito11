    status: PASS
    notes: "Rotas seguem atrás de requireAdmin; intervalMinutes e mode validados por lista fechada; hideEmptyScheduled só aceita 'true' literal; make_interval com parâmetro bind (sem interpolação); nada novo renderizado como HTML."
  performance:
    status: PASS
    notes: "No máximo ~288 execuções/dia × 30 dias ≈ 8,6 mil linhas em mailgrid_report_runs; índice started_at DESC existente atende listRuns, purge e latestConclusiveRun. DELETE por execução toca poucas linhas."
  reliability:
    status: PASS
    notes: "Configuração antiga continua daily sem migration; latestConclusiveRun não é afetado pela limpeza (a execução atual é recente e nunca é apagada; falhas são mantidas); stale de backfill inalterado."
  maintainability:
    status: PASS
    notes: "Mudança mínima nos padrões da 5.1 (deps injetáveis, scheduleCron isolado e testado, listas de intervalos espelhadas no frontend); comentários explicam o porquê da limpeza e do default daily."
