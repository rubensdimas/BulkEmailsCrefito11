schema: 1
story: "5.4"
story_title: "Exportação CSV dos Relatórios Mailgrid falha no download"
gate: PASS
status_reason: "Re-review do 53d12da: o pipeline de stream/promises resolve o REL-001, e um teste HTTP real (express + createReportRouter + repositório real no Postgres de dev, pool max 2) devolveu o CSV completo e manteve o pool livre depois de 6 downloads cancelados. Os 5 ACs estão atendidos e todos os quality_gate_tools passam; restam só observações de severidade baixa."
reviewer: "Quinn (Test Architect)"
updated: "2026-11-26T15:00:00-03:00"
quality_score: 92
history:
  - { at: "2026-11-26T12:00:00-03:00", gate: FAIL, commit: "5a349cc", note: "REL-001 high: abort do cliente travava no drain e prendia a conexão do pool; TEST-001 medium: integração travava sem pg-query-stream" }
  - { at: "2026-11-26T15:00:00-03:00", gate: PASS, commit: "53d12da", note: "REL-001 e TEST-001 resolvidos e verificados" }
top_issues:
  - id: "REL-002"
    severity: low
    finding: "Um erro antes do primeiro byte (pg-query-stream ausente, SQL inválido) destrói o socket (o cliente recebe ECONNRESET, sem 500), embora headersSent ainda seja false. É a decisão Q2, aceita. Além disso, ERR_STREAM_PREMATURE_CLOSE retorna sem log em qualquer etapa do pipeline, não só no abort do cliente: se a origem fechar sem 'end' e sem erro, o download é cortado em silêncio."
    suggested_action: "Opcional: next(error) quando !response.headersSent; e só silenciar o premature close quando response.destroyed && !response.writableFinished."
  - id: "SEC-001"
    severity: low
    finding: "console.error loga o objeto de erro inteiro. A mensagem do knex pode incluir o SQL com os bindings dos filtros, a mesma exposição do httpErrorHandler. Nada vai para o cliente."
    suggested_action: "Aceitável. Se a política de logs ficar mais estrita, logar só message/code."
  - id: "TEST-003"
    severity: low
    finding: "--forceExit em test:integration hoje não mascara nada: sem ele, a suíte sai sozinha (exit 0, 4 s, 38/38). Mas, daqui em diante, ele vai esconder handles vazados em qualquer suíte de integração."
    suggested_action: "Rodar ocasionalmente sem --forceExit (ou com --detectOpenHandles) para não acumular vazamentos silenciosos."
  - id: "TEST-002"
    severity: low
    finding: "CodeRabbit continua não instalado (mesmo encaminhamento dos gates 5.1–5.3)."
    suggested_action: "Mesmo encaminhamento do gate 5.1."
