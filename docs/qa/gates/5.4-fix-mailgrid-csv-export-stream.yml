    - "backend: POSTGRES_PORT=5432 npm run test:integration 38/38 (5 suítes, --forceExit)"
    - "integração sem --forceExit: 38/38, exit 0 em 4 s (sem handles abertos)"
    - "integração com pg-query-stream bloqueado (--setupFilesAfterEnv jest-setup-block.js): 1 failed / 37 passed, exit 1 em 24 s"
    - "HTTP real fora do repo (scratchpad/http-e2e.js): express + createReportRouter + MailgridReportRepository em schema isolado (60k linhas, pool max 2), schema removido no final"
