  trace:
    ac_covered: [1, 2, 3, 4, 5]
    ac_gaps: []
    ac_evidence:
      "1": "pg-query-stream ^4.17.1 em dependencies (lock: 4.17.1 → pg-cursor 2.22.1, pg 8.20.0 deduped); Dockerfile npm ci --omit=dev. HTTP real: 200, text/csv; charset=utf-8, attachment relatorio-mailgrid-20261126.csv, 60000 linhas + header (13,6 MB), complete=true."
      "2": "pipeline em try/catch: erros diferentes de ERR_STREAM_PREMATURE_CLOSE são logados ('Error in report CSV export:') e destroem a resposta, sem next(); 400/422 continuam em handle(). HTTP real: SQL inválido → log + ECONNRESET + pool OK; pg-query-stream bloqueado → log + ECONNRESET. Query inválida → 400."
      "3": "stream/promises.pipeline(repo.stream(), toCsvRows, format(), response) trata a backpressure. HTTP real: 6 aborts após ~64 KB com pool max 2 → 'select 1' OK, nenhum log de erro, novo download completo. Teste unitário 'closes the DB stream when the client aborts the download'."
      "4": "'stream yields…' passa no Postgres real; com pg-query-stream bloqueado (jest-setup-block do dev) a suíte falha em 24 s com exit 1 (timeout de 15 s no teste + forceExit)."
      "5": "'export.csv destroys the response when the stream fails after headers' (destroy(failure), next não chamado, log)."
