# Pre-deploy checks to run on the VPS before `docker stack deploy`:
# - ss -tulpn
# - docker service ls
# - docker ps --format 'table {{.Names}}\t{{.Ports}}'
# - docker network ls | grep CrefitoNet
# - docker volume ls | grep postgres
# - inspect existing Traefik routers/services for Host(`bulkmail.crefito.gov.br`)
# Release criteria:
# - CrefitoNet exists in Swarm
# - 80/443 remain owned by the existing Traefik instance
# - no other Traefik router already claims bulkmail.crefito.gov.br
# - this stack must not publish host ports
# - if a previous Postgres volume exists, preserve it only if it contains real data
services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bulkmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulkmail123}
      POSTGRES_DB: ${POSTGRES_DB:-bulkmail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - CrefitoNet
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  redis:
    image: redis:8.4.2-alpine
    command: >
      sh -c 'if [ -n "$${REDIS_PASSWORD}" ]; then
        redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
      else
        redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - CrefitoNet
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: bulkmail-backend:prod
    environment:
      NODE_ENV: production
      PORT: 3000
      UPLOAD_DIR: /app/uploads
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bulkmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulkmail123}
      POSTGRES_DB: ${POSTGRES_DB:-bulkmail}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MAILGRID_HOST: ${MAILGRID_HOST:-}
      MAILGRID_USER: ${MAILGRID_USER:-}
      MAILGRID_PASS: ${MAILGRID_PASS:-}
      MAILGRID_SENDER: ${MAILGRID_SENDER:-noreply@bulkmail.com}
      MAILGRID_SENDER_NAME: ${MAILGRID_SENDER_NAME:-BulkMail Pro}
      MAILGRID_WEBHOOK_TOKEN: ${MAILGRID_WEBHOOK_TOKEN:-}
      CREFITO11_LOGO_PATH: ${CREFITO11_LOGO_PATH:-/assets/logos/CREFITO 11 - Marca - Neg 2 Completa.png}
      CREFITO11_LOGO_URL: ${CREFITO11_LOGO_URL:-https://bulkmail.crefito.gov.br/api/assets/crefito11-email-logo.png}
    volumes:
      - uploads_data:/app/uploads
      - ./assets:/assets:ro
    networks:
      - CrefitoNet
    command: >
      sh -c "echo 'Waiting for database...' &&
             until pg_isready -h postgres -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}; do sleep 2; done &&
             echo 'Running migrations...' &&
             npm run migrate &&
             echo 'Starting application...' &&
             node dist/app.js"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  worker:
    image: bulkmail-backend:prod
    environment:
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-bulkmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bulkmail123}
      POSTGRES_DB: ${POSTGRES_DB:-bulkmail}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MAILGRID_HOST: ${MAILGRID_HOST:-}
      MAILGRID_USER: ${MAILGRID_USER:-}
      MAILGRID_PASS: ${MAILGRID_PASS:-}
      MAILGRID_SENDER: ${MAILGRID_SENDER:-noreply@bulkmail.com}
      MAILGRID_SENDER_NAME: ${MAILGRID_SENDER_NAME:-BulkMail Pro}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      THROTTLE_RATE: ${THROTTLE_RATE:-50}
      CREFITO11_LOGO_URL: ${CREFITO11_LOGO_URL:-https://bulkmail.crefito.gov.br/api/assets/crefito11-email-logo.png}
    volumes:
      - uploads_data:/app/uploads
      - ./assets:/assets:ro
    networks:
      - CrefitoNet
    command: >
      sh -c "echo 'Waiting for database...' &&
             until pg_isready -h postgres -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}; do sleep 2; done &&
             echo 'Starting worker...' &&
             node dist/queue/emailWorker.js"
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  frontend:
    image: bulkmail-frontend:prod
    networks:
      - CrefitoNet
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.bulkmail.rule=Host(`bulkmail.crefito.gov.br`)"
        - "traefik.http.routers.bulkmail.entrypoints=websecure"
        - "traefik.http.routers.bulkmail.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.bulkmail.loadbalancer.server.port=80"

networks:
  CrefitoNet:
    external: true

volumes:
  postgres_data:
    external: true
    name: postgres_data
  redis_data:
  uploads_data:
